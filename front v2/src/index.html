<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Loja Gerencial</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
  <app-root></app-root>
</body>
<script>
  const waitForCss = () => {
    const requiredHrefs = [
      'styles.css',      // seu nome de CSS, ajuste conforme o build
      // 'assets/css/other.css', // adicione mais se necessário
    ];

    const areStylesLoaded = () => {
      return requiredHrefs.every(href =>
        [...document.styleSheets].some(s => s.href && s.href.includes(href))
      );
    };

    const checkLoaded = () => {
      if (areStylesLoaded()) {
        document.body.classList.remove('app-hidden');
      } else {
        requestAnimationFrame(checkLoaded);
      }
    };

    checkLoaded();
  };

  waitForCss();
</script>

</html>
