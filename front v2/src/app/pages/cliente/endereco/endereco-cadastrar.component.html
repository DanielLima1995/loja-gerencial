

<div class="bg-default">
    <div class="card p-4">
      <div class="card-title">
        <h4>Cadastrar Endereco</h4>
      </div>
      <div class="card-body">
        <form [formGroup]="enderecoForm" (ngSubmit)="onSubmit()">
        <div class="conteudo bg-white">
            <div class="row">
                <div class="col-12 col-lg-4 ">
                    <label for="cep">CEP</label>
                  <input
                      formControlName="cep"
                      id="cep"
                      required
                      (blur)="onBuscarCep()"
                      maxlength="9"
                      placeholder="Digite o CEP"
                      class="form-control"
                    />
                </div>
                <div class="col-12 col-lg-4 ">
                    <label for="logradouro">Logradouro</label>
                    <input formControlName="logradouro" class="form-control" id="logradouro" required />
                </div>
                <div class="col-12 col-lg-4 ">
                    <label for="numero">Número</label>
                    <input formControlName="numero" class="form-control" id="numero" required />
                </div>
                <div class="col-12 col-lg-4 ">
                    <label for="bairro">Bairro</label>
                    <input formControlName="bairro"  class="form-control" id="bairro" required />
                </div>
                <div class="col-12 col-lg-4 ">
                    <label for="cidade">Cidade</label>
                    <input formControlName="cidade"  class="form-control" id="cidade" required />
                </div>
                <div class="col-12 col-lg-4 ">
                    <label for="uf">UF</label>
                    <input formControlName="uf"  class="form-control" id="uf" required />
                </div>
                <div class="col-12 col-lg-4 ">
                    <label for="complemento">Complemento</label>
                    <input formControlName="complemento"  class="form-control" id="complemento" />
                </div>
                <div class="col-12 col-lg-4 ">
                    <label for="pontoReferencia">Ponto de Referência</label>
                    <input formControlName="pontoReferencia" class="form-control" id="pontoReferencia" />
                </div>
            </div>
        </div>
        </form>
      </div>
      <div class="card-footer d-flex bg-white justify-content-end ">
        <button type="submit" class="btn btn-primary btn-lg radius-0 bg-flower-blue" [disabled]="!enderecoForm.valid" (click)="onSubmit()" >Salvar</button>
      </div>
  </div>
</div>
