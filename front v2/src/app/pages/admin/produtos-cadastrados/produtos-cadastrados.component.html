<ng-container *ngIf="carregando">
  <app-carregamento></app-carregamento>
</ng-container>
<div class="bg-default" [ngClass]="{
  'd-none': carregando
}">
  <div class="card p-4">
    <div class="card-title d-flex  justify-content-between ">
      <h4>Produtos</h4>
      <button type="submit" class="btn btn-primary radius-0 bg-flower-blue float-right" [routerLink]="'/admin/produtos/cadastrar'" >Cadastrar Produto</button>
    </div>
    <div class="card-body padding-lateral-responsivo padding-top-responsivo">
      <div class="conteudo bg-white">
          <div class="row">
            <div class="col-12 col-lg-6 d-grid" *ngFor="let produto of products">
              <div class="card right-shadow m-2">
                  <div class="card-body">
                      <div class=" d-flex">
                      <div class="coluna-imagem">
                          <img src="{{ produto.imagemPrincipal?.imagemUrl }}" class="d-block" alt="..."/>
                      </div>
                      <div class="coluna-conteudo pl-4 w-100">
                          <div>
                            <div class="bold">{{produto.titulo}}</div>
                            <div class="d-none d-sm-block">{{produto.descricaoBasica}}</div>
                              <div>
                                  <div class="row">
                                      <div class="col-12 col-lg-6">
                                        <label for="valor" class="bold">Valor</label>
                                        <div>
                                          {{globalFunctions.valorConvertido(produto.valor)}}
                                        </div>
                                      </div>
                                      <div class="col-12 col-lg-6">
                                        <label for="valor" class="bold">Ativo?</label>
                                        <div>
                                          {{produto.ativo ? 'Sim' : 'Não'}}
                                        </div>
                                      </div>
                                  </div>
                              </div>
                          </div>
                      </div>
                    </div>
                    <div class="d-block d-sm-none mt-4">{{produto.descricaoBasica}}</div>

                    <hr />
                    <label class="bold mt-2" >Tags</label>
                    <div class="d-flex flex-wrap mt-2 overflow-auto overflow-tags">
                      <div class="dv-tags bg-caddet text-white " *ngFor="let tag of produto.tags">
                        {{tag.descricao}}
                      </div>
                    </div>
                  </div>
                  <div class="card-footer d-flex  justify-content-end">
                    <button class="btn btn-primary mr-2 radius-0 bg-brown" (click)="excluirProduto(produto.id)">Excluir</button>
                    <button type="submit" class="btn btn-primary radius-0 bg-gold"  [routerLink]="'/admin/produtos/editar/' + produto.id">Editar</button>
                  </div>
              </div>
          </div>
          </div>
          <div class="mt-4">
            <app-pagination  *ngIf="products.length > 0"
              [currentPage]="currentPage"
              [totalPages]="totalPages"
              (pageChanged)="onPageChanged($event)">
            </app-pagination>
          </div>
      </div>
    </div>
    
  </div>
  
  
</div>
