
<ng-container *ngIf="carregando">
  <app-carregamento></app-carregamento>
</ng-container>

<div class="bg-default" *ngIf="!carregando">
  <div class="card">
    <div class="card-body">
      <div class="conteudo d-initial d-md-flex  bg-white" *ngIf="produto">
        <div id="slide-detalhes" class="carousel slide d-flex w-small-100 w-initial">
          <!-- Thumbnails on the left -->
          <div class="carousel-thumbnails d-flex flex-column me-3">
      
            <button *ngFor="let imagem of produto?.imagens; let c = index" data-bs-slide-to="0" type="button"
              data-bs-target="#slide-detalhes" [ngClass]="{
              'active': c == changeImagemAtiva
            }" class="active thumbnail-btn mb-2 " (click)="gerenciaImagemAtiva(c)" aria-current="true">
              <img src="{{imagem.imagemUrl}}" class="img-thumbnail right-shadow " alt="Preview">
            </button>
          </div>
      
          <!-- Main carousel content -->
          <div class="carousel-inner flex-grow-1 m-1">
            <div class="carousel-item" *ngFor="let imagem of produto?.imagens; let i = index" [ngClass]="{
              'active': i == changeImagemAtiva
            }">
              <img src="{{imagem.imagemUrl}}" class="d-block img-fluid right-shadow m-1" alt="Slide 1">
            </div>
          </div>
      
          <!-- Navigation controls -->
      
        </div>
        <div class="row d-initial w-divisorias m-4">
          <div class="col-sm-12">
            <h4>
              {{produto.titulo}}
            </h4>
          </div>
          <div class="col-sm-12">
            <small>{{produto.descricaoBasica}}</small>
          </div>
          <div  class="col-sm-12" *ngIf="tags && coresDisponiveis.length > 0">
            <label for="dv-cores" class="bold">
              Cores Disponíveis:
            </label>
            <div class="dv-cores p-2">
              <app-select-cores  [tags]="coresDisponiveis" (selectedColor)="alteraCor($event)"></app-select-cores>
            </div>
          
          </div>
          <div  class="col-sm-12" >
            <label for="dv-cores" class="bold">
              Quantidade:
            </label>
            <div class="dv-quantidade p-2">
              <app-input-numerico [(value)]="currentValue" [min]="0" [max]="999" [step]="1"></app-input-numerico>
            </div>
          </div>

          <div  class="col-sm-12" *ngIf="tags && tags['Tamanho']">
            <label for="dv-tamanho" class="bold">
              Tamanho:
            </label>
            <div class="dv-tamanho p-2">
              <app-select-tamanhos  [items]="tamanhosDisponiveis" (selectedValue)="alteraTamanho($event)"></app-select-tamanhos>
            </div>

            <div class="col-sm-12" *ngIf="generosDisponiveis.length > 1">
              <label for="dv-genero" class="bold">Gênero:</label>
              <div class="dv-genero p-2">
                <app-select-tamanhos [items]="generosDisponiveis" (selectedValue)="alteraGenero($event)"></app-select-tamanhos>
              </div>
            </div>
          
          </div>
          
          <div  class="col-sm-12" >
            <h2>{{globalFunctions.valorConvertido(produto.valor)}}</h2>
          </div>
    
          <div  class="col-sm-12" >
            <button class="btn btn-success w-100 radius-0" (click)="sendCarrinho()" [disabled]="carregandoVenda">Adicionar ao Carrinho</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  
  <div class="conteudo  bg-white mt-4 p-4" *ngIf="produto">
  <h4>Detalhes</h4>
  <div [innerHTML]="produto.descricao"></div>

  </div>

  <div class="conteudo  bg-white mt-4 p-4">
    <app-produtos-relacionados [idProduto]="idProduto" [showDescricao]="false" [qtdTotalMobile]="1" [titulo]="'Ofertas do Dia'" [qtdRow]="3" [qtdTotal]="3" [qtdRowMobile]="1" ></app-produtos-relacionados>
  </div>
</div>
