<ng-container *ngIf="carregando">
  <app-carregamento></app-carregamento>
</ng-container>
<div class="bg-default" [ngClass]="{
    'd-none': carregando
  }">
    <div class="card p-4">
      <div class="card-title">
        <h4>Editar Endereço</h4>
      </div>
      <div class="card-body">
        <form [formGroup]="enderecoForm" (ngSubmit)="onSubmit()">
        <div class="conteudo bg-white">
            <div class="row">
                <div class="col-12 col-lg-4 ">
                    <label for="cep">CEP</label>
                  <input
                      formControlName="cep"
                      id="cep"
                      required
                      (blur)="onBuscarCep()"
                      maxlength="8"
                      placeholder="Digite o CEP"
                      class="form-control"
                    />
                </div>
                <div class="col-12 col-lg-4 ">
                    <label for="logradouro">Logradouro</label>
                    <input formControlName="logradouro" class="form-control" id="logradouro" required />
                </div>
                <div class="col-12 col-lg-4 ">
                    <label for="numero">Número</label>
                    <input formControlName="numero" class="form-control" id="numero" required />
                </div>
                <div class="col-12 col-lg-4 ">
                    <label for="bairro">Bairro</label>
                    <input formControlName="bairro"  class="form-control" id="bairro" required />
                </div>
                <div class="col-12 col-lg-4 ">
                    <label for="localidade">Cidade</label>
                    <input formControlName="localidade"  class="form-control" id="localidade" required />
                </div>
                <div class="col-12 col-lg-4 ">
                    <label for="uf">UF</label>
                    <input formControlName="uf"  class="form-control" id="uf" required />
                </div>
                <div class="col-12 col-lg-4 ">
                    <label for="estado">Estado</label>
                    <input formControlName="estado"  class="form-control" id="estado" required />
                </div>
                <div class="col-12 col-lg-4 ">
                    <label for="complemento">Complemento</label>
                    <input formControlName="complemento"  class="form-control" id="complemento" />
                </div>
                <div class="col-12 col-lg-4 ">
                    <label for="ponto_referencia">Ponto de Referência</label>
                    <input formControlName="ponto_referencia" class="form-control" id="ponto_referencia" />
                </div>
            </div>
        </div>
        </form>
      </div>
      <div class="card-footer d-flex bg-white justify-content-end ">
        <button type="submit" class="btn btn-primary btn-lg radius-0 bg-flower-blue" [disabled]="!enderecoForm.valid" (click)="onSubmit()" >Salvar</button>
      </div>
  </div>
</div>
