<div>
    <div class="justify-content-center w-100">
      <div class="">
        <div class="card">
          <div class="card-body  bg-default d-flex justify-content-around">
            <form #loginForm="ngForm" (ngSubmit)="onLogin(loginForm)" class="bg-white">
              <div class="form-group mb-4">
                <label for="cpf" class="bold">CPF ou Email</label>
                <input type="text" id="email" class="form-control radius-0" name="email" [(ngModel)]="email" mask="000.000.000-00" required />
              </div>
              <div class="form-group">
                <label for="senha" class="bold">Senha</label>
                <div class="input-group">
                  <input [type]="showPassword ? 'text' : 'password'" required id="senha" class="form-control" name="senha" [(ngModel)]="senha" required />
                  <div class="input-group-append">
                    <button type="button" class="btn btn-outline-secondary gerenciar-senha" (click)="togglePasswordVisibility()">
                      <i class="fa fa-eye" *ngIf="!showPassword" aria-hidden="true"></i>
                      <i class="fa fa-eye-slash" *ngIf="showPassword" aria-hidden="true"></i>
                    </button>
                  </div>
                </div>
              </div>
                <button type="submit" class="btn btn-success btn-block w-100 mt-4 w-50 radius-0" >Entrar</button>
                <div class="text-center">Esqueceu os dados de acesso? <a class="btn btn-link pl-0" [routerLink]="'/cadastro'">CLIQUE AQUI</a></div>
                <button class="btn btn-primary btn-block w-100 mt-4 w-50 radius-0" [routerLink]="'/cadastro'">Cadastrar</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
