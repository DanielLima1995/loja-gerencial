<div class="d-ruby">
  <ng-container *ngFor="let item of items; let count = count;">
    <div class="mr-2 mt-2" *ngIf="!onlySelected || item.id == actualItem">
      <button class="btn tamanhos border-none bold" (click)="sendSelectedItem(item.id)" [disabled]="onlySelected" [ngClass]="{
        'active': (item.id == actualItem)
      }">{{ item?.descricao ?? item.tipo }}</button>
    </div>
  </ng-container>
  
</div>
