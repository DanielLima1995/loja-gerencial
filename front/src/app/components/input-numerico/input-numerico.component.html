<div class="input-group" style="max-width: 200px;">
    <button class="btn btn-outline-secondary" [disabled]="disabled" type="button" (click)="decrement()">-</button>
    <input type="number"  [disabled]="disabled"
           class="form-control text-center" 
           [(ngModel)]="value"
           [min]="min" 
           [max]="max" 
           [step]="step">
    <button class="btn btn-outline-secondary" [disabled]="disabled"  type="button" (click)="increment()">+</button>
  </div>
