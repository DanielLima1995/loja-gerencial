<ng-container *ngIf="carregando">
    <app-carregamento></app-carregamento>
  </ng-container>
<div [ngClass]="{
    'd-none': carregando
  }">
    <div>
        <h4>Produtos Relacionados</h4>
    </div>
    <div>
        <div class="row" *ngIf="products">
            <ng-container  *ngFor="let p of products; let c = index">
                <div class="col-{{colsMobile}} col-lg-{{colsScreen}} mt-4"  *ngIf="c < qtdTotal">
                    <a class="dv-cards text-decoration-none mr-2 mb-4" [routerLink]="'/produto/detalhes/' + p.id">
                        <div class="card h-100 border-none right-shadow p-2 radius-0">
                            <img [src]="p?.imagemPrincipal?.imagem" class="card-img-top imagem-produto" alt="Imagem do Produto" />
                            <div class="card-body">
                                <h6 class="card-title">{{ p.titulo }}</h6>
                                <p *ngIf="showDescricao">{{ refatoraDescricao(p.descricao_basica) }}</p>
                                <h6 class="font-weight-bold  valor-card">{{ GlobalFunctions.valorConvertido(p.valor) }}</h6>
                            </div>
                        </div>
                    </a>
                </div>
            </ng-container>
        </div>
    </div>    
</div>
